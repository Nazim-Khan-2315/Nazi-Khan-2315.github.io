<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border Gradient: Blue/Cyan (bottom-left) to Purple/Magenta (top-right) -->
    <linearGradient id="borderGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Subtle Soft Drop Shadow for Icon -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Off-White / Cream Background Container with Rounded Corners and Gradient Border -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="130"
    ry="130"
    fill="#f5f3ec"
    stroke="url(#borderGradLight)"
    stroke-width="34"
  />

  <!-- Subtle inner light border highlight -->
  <rect
    x="36"
    y="36"
    width="440"
    height="440"
    rx="112"
    ry="112"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.7"
  />

  <!-- Crisp Deep Teal/Blue < /> Symbol -->
  <g filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Angle Bracket < -->
    <path d="M 205 196 L 145 256 L 205 316" stroke="#0e7490" stroke-width="34" />
    <!-- Forward Slash / -->
    <path d="M 240 336 L 272 176" stroke="#0e7490" stroke-width="34" />
    <!-- Right Angle Bracket > -->
    <path d="M 307 196 L 367 256 L 307 316" stroke="#0e7490" stroke-width="34" />
  </g>
</svg>
